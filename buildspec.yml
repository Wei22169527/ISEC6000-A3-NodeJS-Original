version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false

  build:
    commands:
      - npm run build
      - test -f dist-server/bin/www

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - 'node_modules/**/*'
    - '.git/**/*'
